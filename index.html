<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
<script defer src="main.js"></script></head>
<body>
    <div id="container">
        <div class="title">
            <span class="one">THE COST OF</span>
            <span class="two">PROCRASTINATION</span>
            <span class="three">...is the life you could have lived...</span>
        </div>
        <div class="containerOne">
            <aside class="lists">
                    <header class="createList">
                        <div id="svgContainer">
                            <img src="804d4b6cf4e2e1a01455.svg" alt="List icon" width="40">
                            <div>My Lists</div>
                        </div>
                        <button id="createListButton">+</button>
                    </header>
                    <div class="createListContainer"></div>
            </aside>
            <main class="listItems">
                <div>
                    <header id="listHeader">
                        <div class="displayListHeader"></div>
                        <button class="delListBtn">Delete List</button>
                    </header>
                </div>
                <div class="displayListItems"></div>
                <div class="itemInputDiv">
                    <input type="text" id="taskInput" value="" placeholder="+ Add Task">
                    <button id="addTaskBtn">Add Task</button>
                </div>
            </main>
            <div class="taskInfo">
                <header class="displayTaskHeaderContainer">
                    <div class="displayTaskHeader"></div>
                    <div class="btnContainer"></div>
                </header>
                <div class="displayTaskInfoOne">
                    <div id="descriptionHeader">Description</div>
                    <div id="description"></div>
                </div>
                <div class="displayTaskInfoTwo">
                    <p id="descriptionContainer">
                        <label for="textArea">Add/Edit Description:</label>
                        <textarea name="textArea" id="textArea"></textarea>
                        <button id="textAreaBtn">Add</button>
                    </p>
                    <p id="dueDateContainer">
                        <label for="dueDate">Add/Edit Due Date:</label>
                        <div>
                            <input type="date" id="dueDate">
                            <button id="dueDateBtn">Add</button>
                        </div>
                    </p>
                    <p id="priorityContainer">
                        <label for="priority">Select/Change Priority:</label>
                        <div>
                            <select name="priority" id="priority">
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                            <button id="priorityBtn">Add</button>
                        </div>
                    </p>
                    <img class="sticker" src="7e59a215f41b7cc9c0c3.png" alt="a person planning sticker" width="300">
                </div>
                
            </div>
        </div>
        <footer class="foot"><a href="https://www.flaticon.com/free-stickers/calendar" title="calendar stickers">Calendar stickers created by kerismaker - Flaticon</a></footer>
    </div>
    <dialog id="myListsDialog">
        <form>
            <p>
                <input id="dialogInput" type="text" value="" placeholder="Add a list title">
            </p>
            <div>
                <button id="confirmBtn" value="default">Confirm</button>
            </div>
        </form>
    </dialog>
</body>
</html>
